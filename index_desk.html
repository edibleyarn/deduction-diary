/* ---------- quests ---------- */
function viewQuests() {
  const act = activeQuests().sort(questSort);
  const rev = reviewQuests().sort((a, b) => (a.deadline < b.deadline ? -1 : 1));
  const held = live('quests').filter((q) => q.status === 'held');
  const done = live('quests').filter((q) => q.status === 'done').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const abandoned = live('quests').filter((q) => q.status === 'abandoned');
  const tab = ui.questTab;

  let h, sub = '';
  if (rev.length) { h = `${cap(numWord(rev.length))} ${plural(rev.length, 'quest has', 'quests have')} passed ${plural(rev.length, 'its', 'their')} deadline`; sub = `Review ${plural(rev.length, 'it', 'them')} to reschedule, keep, hold or let go.`; }
  else if (act.length) {
    const next = act.filter((q) => q.deadline).sort((a, b) => (a.deadline < b.deadline ? -1 : 1))[0];
    h = next ? `Next deadline: ${next.title}` : `${cap(numWord(act.length))} active ${plural(act.length, 'quest')}, none with a deadline`;
    sub = next ? `Due ${fmtDayInline(next.deadline, { long: true })}.` : '';
  } else { h = done.length ? 'No active quests' : 'No quests yet'; sub = done.length ? `${cap(numWord(done.length))} completed so far.` : 'A quest can be anything from a chore to a step in a project.'; }

  const tabs = seg('quest-tab', [
    ['active', 'Active'], ['review', 'Review'], ['held', 'On hold'], ['done', 'Completed'],
  ], tab, 'aria-label="Quest lists"').replace(/>(Active|Review|On hold|Completed)<\/button>/g, (m, l) => {
    const n = { Active: act.length, Review: rev.length, 'On hold': held.length, Completed: done.length }[l];
    return `>${l}<span class="count">${n}</span></button>`;
  });

  let body = '';
  if (tab === 'active') {
    body = act.length ? `<ul class="rows">${act.map((q) => questRow(q)).join('')}</ul>`
      : `<div class="empty"><strong>No active quests.</strong>Create one here or with quick capture (<kbd>N</kbd>).<br><button class="btn" data-act="new-quest">${icon('plus')}New quest</button></div>`;
  } else if (tab === 'review') {
    body = rev.length ? rev.map((q) => `
      <div class="review-card card ornate" data-row="${q.id}">
        <button class="row-main" data-act="open-quest" data-id="${q.id}"><span class="row-title">${esc(q.title)}</span></button>
        <div class="row-meta">${questMeta(q)}</div>
        <div class="review-actions">
          ${ui.rescheduling === q.id
            ? `<label class="visually-hidden" for="resched-${q.id}">New deadline</label><input class="input" type="date" id="resched-${q.id}" data-key="resched-${q.id}" min="${todayStr()}"><button class="btn primary small" data-act="resched-save" data-id="${q.id}">Set deadline</button><button class="btn quiet small" data-act="resched-cancel">Cancel</button>`
            : `<button class="btn small" data-act="resched" data-id="${q.id}">Reschedule</button>
               <button class="btn small" data-act="keep" data-id="${q.id}">Keep active</button>
               <button class="btn small" data-act="hold" data-id="${q.id}">Put on hold</button>
               <button class="btn quiet small" data-act="abandon" data-id="${q.id}">Abandon</button>`}
        </div>
      </div>`).join('')
      : `<div class="empty"><strong>Nothing to review.</strong>Quests land here when their deadline passes, so you can decide what happens next.</div>`;
  } else if (tab === 'held') {
    body = held.length ? `<ul class="rows">${held.map((q) => `
      <li class="row">
        <button class="row-main" data-act="open-quest" data-id="${q.id}"><span class="row-title">${esc(q.title)}</span><span class="row-meta">${questMeta(q)}</span></button>
        <div class="row-actions" style="opacity:1"><button class="btn small" data-act="resume" data-id="${q.id}">${icon('play')}Resume</button></div>
      </li>`).join('')}</ul>`
      : `<div class="empty"><strong>Nothing on hold.</strong>Held quests wait here without a deadline until you resume them.</div>`;
  } else {
    const groups = new Map();
    for (const q of done) {
      const k = new Date(q.doneAt || q.updatedAt).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(q);
    }
    body = done.length ? [...groups].map(([k, qs]) => `<div class="month-head">${esc(k)}</div><ul class="rows">${qs.map((q) => `
      <li class="row">
        ${tick(true, 'uncomplete', q.id, `Mark ${q.title} as not done`)}
        <button class="row-main" data-act="open-quest" data-id="${q.id}"><span class="row-title">${esc(q.title)}</span>
          <span class="row-meta"><span>Completed ${esc(fmtDay(dateStr(new Date(q.doneAt))))}</span>${q.projectId && get('projects', q.projectId) ? `<span>${esc(projectName(q.projectId))}</span>` : ''}${q.reward ? `<span>Reward: ${esc(q.reward)}</span>` : ''}</span></button>
      </li>`).join('')}</ul>`).join('')
      : `<div class="empty"><strong>No completed quests yet.</strong>Completed quests are kept here.</div>`;
    if (abandoned.length) {
      body += `<p style="margin-top:24px"><button class="link-btn" data-act="toggle-abandoned">${ui.showAbandoned ? 'Hide' : 'Show'} abandoned quests (${abandoned.length})</button></p>`;
      if (ui.showAbandoned) body += `<ul class="rows">${abandoned.map((q) => `
        <li class="row"><button class="row-main" data-act="open-quest" data-id="${q.id}"><span class="row-title faint">${esc(q.title)}</span></button>
        <div class="row-actions" style="opacity:1"><button class="btn small" data-act="resume" data-id="${q.id}">${icon('rotate-ccw')}Restore</button></div></li>`).join('')}</ul>`;
    }
  }

  return `<div class="page">
    <header class="page-head"><div><h1>${esc(h)}</h1>${FLOURISH}${sub ? `<p class="lede">${esc(sub)}</p>` : ''}</div>
      <button class="btn primary" data-act="new-quest">${icon('plus')}New quest</button></header>
    <div class="toolbar">${tabs}</div>
    ${body}
  </div>`;
}
function questRow(q) {
  const onToday = q.today === todayStr();
  return `<li class="row" data-row="${q.id}">
    ${tick(false, 'complete', q.id, `Complete ${q.title}`)}
    <button class="row-main" data-act="open-quest" data-id="${q.id}"><span class="row-title">${esc(q.title)}</span><span class="row-meta">${questMeta(q)}</span></button>
    <div class="row-actions">${onToday
      ? `<button class="btn quiet small" data-act="unpin" data-id="${q.id}">Remove from today</button>`
      : `<button class="btn quiet small" data-act="pin" data-id="${q.id}">Add to today</button>`}</div>
  </li>`;
}

/* ---------- projects ---------- */
function viewProjects() {
  const all = live('projects');
  const by = (s) => all.filter((p) => p.status === s).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const active = by('active');
  let h;
  if (!all.length) h = 'No projects yet';
  else if (!active.length) h = 'No active projects right now';
  else if (active.length === 1) h = `Working on ${active[0].title}`;
  else if (active.length === 2) h = `Working on ${active[0].title} and ${active[1].title}`;
  else h = `Working on ${active[0].title}, ${active[1].title} and ${numWord(active.length - 2)} more`;

  const card = (p) => {
    const pr = progress(p);
    const ts = timeSpent(p);
    const openQ = questsOf(p.id).filter((q) => q.status === 'active').length;
    return `<button class="proj-card card ornate" data-act="open-project" data-id="${p.id}">
      <h3>${esc(p.title)}</h3>
      ${p.goal ? `<div class="goal">${esc(p.goal)}</div>` : ''}
      ${meter(pr)}
      <div class="card-foot">${openQ ? `<span>${openQ} open ${plural(openQ, 'quest')}</span>` : ''}${ts ? `<span>${fmtMins(ts)} logged</span>` : ''}</div>
    </button>`;
  };
  const listRow = (p) => `<li class="row"><button class="row-main" data-act="open-project" data-id="${p.id}"><span class="row-title">${esc(p.title)}</span>
    <span class="row-meta">${p.status === 'completed' && p.completedAt ? `<span>Finished ${esc(fmtDay(dateStr(new Date(p.completedAt))))}</span>` : ''}${timeSpent(p) ? `<span>${fmtMins(timeSpent(p))} logged</span>` : ''}<span>${progress(p).done} of ${progress(p).total} done</span></span></button></li>`;

  const group = (s, label, desc, compact = false) => {
    const ps = by(s);
    if (!ps.length) return '';
    return `<section class="proj-group" data-group="${s}"><div class="section-head"><h2>${label}</h2><span class="muted">${desc}</span></div>
      ${compact ? `<ul class="rows proj-list">${ps.map(listRow).join('')}</ul>` : `<div class="proj-grid">${ps.map(card).join('')}</div>`}</section>`;
  };

  return `<div class="page">
    <header class="page-head"><div><h1>${esc(h)}</h1>${FLOURISH}${all.length ? '' : '<p class="lede">A project holds a goal, its stages and the quests that move it forward.</p>'}</div>
      <button class="btn primary" data-act="new-project">${icon('plus')}New project</button></header>
    ${all.length ? '' : `<div class="empty"><strong>Start with one thing you’re working towards.</strong>Progress is worked out from the stages and quests you finish.<br><button class="btn" data-act="new-project">${icon('plus')}New project</button></div>`}
    ${group('active', 'Active', 'Being worked on')}
    ${group('available', 'Available', 'Ready to pick up')}
    ${group('hibernating', 'Hibernating', 'Paused on purpose')}
    ${group('completed', 'Completed', 'Finished', true)}
    ${group('abandoned', 'Abandoned', 'Let go', true)}
  </div>`;
}

/* ---------- university ---------- */
function courseGrade(cid) {
  const items = live('uniItems').filter((i) => i.courseId === cid);
  const graded = items.filter((i) => i.grade != null && i.weight > 0);
  const w = graded.reduce((s, i) => s + i.weight, 0);
  const weightTotal = items.reduce((s, i) => s + (i.weight || 0), 0);
  return { current: w ? graded.reduce((s, i) => s + i.grade * i.weight, 0) / w : null, gradedWeight: w, weightTotal };
}
function viewUniversity() {
  const t = todayStr();
  const courses = live('courses').sort((a, b) => ((a.code || a.name) < (b.code || b.name) ? -1 : 1));
  const soon = deadlines(t, addDays(t, 13)).filter((d) => d.source === 'university');
  const late = pastDueUni();
  let h = !courses.length ? 'No courses yet' : soon.length ? `${cap(numWord(soon.length))} university ${plural(soon.length, 'item')} due in the next two weeks` : 'Nothing due for university in the next two weeks';
  const sub = late.length ? `${cap(numWord(late.length))} past ${plural(late.length, 'item')} not marked submitted.` : soon.length ? `Next: ${soon[0].title}, due ${fmtDayInline(soon[0].day)}.` : '';

  const courseHTML = courses.map((c) => {
    const items = live('uniItems').filter((i) => i.courseId === c.id).sort((a, b) => ((a.due || '9') < (b.due || '9') ? -1 : 1));
    const g = courseGrade(c.id);
    return `<section class="course card ornate">
      <div class="course-head"><h2><button data-act="open-course" data-id="${c.id}">${c.code ? `<span class="course-code">${esc(c.code)}</span>${esc(c.name || '')}` : esc(c.name)}</button></h2>
        ${c.needsCheck ? `<span class="check-flag">${icon('circle-alert')}Check: ${esc(c.checkNote || 'details unconfirmed')}</span>` : ''}</div>
      <div class="course-sub">
        <span>${g.current != null ? `Current grade ${NF.format(Math.round(g.current * 10) / 10)}% across ${NF.format(g.gradedWeight)}% of the course weight` : 'No grades recorded yet'}</span>
        ${items.length && Math.round(g.weightTotal) !== 100 ? `<span>Weights recorded: ${NF.format(g.weightTotal)}% of 100%</span>` : ''}
        ${c.instructor ? `<span>${esc(c.instructor)}</span>` : ''}
      </div>
      ${c.requirements ? `<p class="reqs">${esc(c.requirements)}</p>` : ''}
      ${items.length ? `<table class="utable"><thead><tr><th>Item</th><th>Type</th><th>Due</th><th class="num">Weight</th><th class="num">Grade</th><th>Submitted</th></tr></thead><tbody>
        ${items.map((i) => `<tr class="clickable ${i.submitted ? 'submitted' : ''}" data-act="open-uni-item" data-id="${i.id}">
          <td class="title-cell">${esc(i.title)}${i.needsCheck ? `<br><span class="check-flag" style="font-size:14px">${icon('circle-alert')}Check: ${esc(i.checkNote || 'unconfirmed')}</span>` : ''}</td>
          <td>${esc((UNI_KINDS.find((k) => k[0] === i.kind) || ['', 'Other'])[1])}</td>
          <td>${i.due ? (i.submitted ? esc(fmtDay(i.due)) : dayCell(i.due)) : '<span class="faint">No date</span>'}</td>
          <td class="num">${i.weight != null ? NF.format(i.weight) + '%' : '<span class="faint">—</span>'}</td>
          <td class="num">${i.grade != null ? NF.format(i.grade) + '%' : '<span class="faint">—</span>'}</td>
          <td><input type="checkbox" data-act="toggle-submitted" data-id="${i.id}" ${i.submitted ? 'checked' : ''} aria-label="Submitted: ${esc(i.title)}"></td>
        </tr>`).join('')}</tbody></table>` : '<p class="muted">No items yet.</p>'}
      <p style="margin-top:12px"><button class="btn small" data-act="new-uni-item" data-course="${c.id}">${icon('plus')}Add item</button></p>
    </section>`;
  }).join('');

  return `<div class="page">
    <header class="page-head"><div><h1>${esc(h)}</h1>${FLOURISH}${sub ? `<p class="lede">${esc(sub)}</p>` : ''}</div>
      <button class="btn primary" data-act="new-course">${icon('plus')}Add course</button></header>
    ${courses.length ? courseHTML : `<div class="empty"><strong>Add your courses to track assignments, quizzes, papers and grades.</strong>Anything you’re unsure of from a syllabus can be marked for checking later.<br><button class="btn" data-act="new-course">${icon('plus')}Add course</button></div>`}
  </div>`;
}

/* ---------- notes ---------- */
function viewNotes() {
  const notes = live('notes').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const last = notes.reduce((m, n) => Math.max(m, n.updatedAt || 0), 0);
  const h = notes.length ? `${cap(numWord(notes.length))} ${plural(notes.length, 'note')}, last edited ${fmtAgo(last)}` : 'Nothing written here yet';
  return `<div class="page">
    <header class="page-head"><div><h1>${esc(h)}</h1>${FLOURISH}<p class="lede">No folders, tags or format. Click any note to keep writing; changes save as you type.</p></div></header>
    <div class="notes-compose card">
      <label class="visually-hidden" for="note-new">New note</label>
      <textarea class="textarea" id="note-new" data-key="note-new" placeholder="Write anything…"></textarea>
      <div class="capture-foot"><span class="hint"><kbd>${IS_MAC ? '⌘' : 'Ctrl'}</kbd> + <kbd>Enter</kbd> to save</span><span class="spacer"></span><button class="btn primary" data-act="note-add">Save note</button></div>
    </div>
    <div class="notes-grid">${notes.map((n) => `
      <div class="note" data-note="${n.id}">
        <label class="visually-hidden" for="note-${n.id}">Note</label>
        <textarea id="note-${n.id}" data-key="note-${n.id}" data-note-edit="${n.id}" rows="1">${esc(n.body)}</textarea>
        <div class="note-foot"><span>${esc(fmtDay(dateStr(new Date(n.createdAt))))}</span><span class="saved-mark" aria-live="polite"></span><span class="spacer"></span>
          <button class="icon-btn" data-act="note-del" data-id="${n.id}" aria-label="Delete note" title="Delete note">${icon('trash-2')}</button></div>
      </div>`).join('')}</div>
  </div>`;
}
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

/* ---------- finance ---------- */
function viewFinance() {
  const b = balanceRec();
  const wish = live('wishlist').filter((w) => !w.bought).sort((a, b2) => (a.createdAt || 0) - (b2.createdAt || 0));
  const bought = live('wishlist').filter((w) => w.bought);
  const h = b.amount == null ? 'No balance recorded yet' : `Balance last updated ${fmtAgo(b.setAt || b.updatedAt)}`;
  const wishTotal = wish.reduce((s, w) => s + (w.price || 0), 0);
  const editing = ui.editingBalance || b.amount == null;
  return `<div class="page">
    <header class="page-head"><div><h1>${esc(h)}</h1>${FLOURISH}<p class="lede">Your balance is updated by hand, whenever you check it.</p></div></header>
    <div class="balance-hero card ornate">
      ${b.amount != null ? `<div><div class="field-label">Balance</div><div class="balance-amount">${esc(money(b.amount, b.currency))}</div></div>` : ''}
      ${editing ? `<div class="balance-form">
          <div class="field" style="margin:0"><label for="bal-amount">Amount</label><input class="input" id="bal-amount" data-key="bal-amount" type="number" step="0.01" inputmode="decimal" value="${b.amount ?? ''}"></div>
          <div class="field" style="margin:0"><label for="bal-cur">Currency</label><input class="input cur" id="bal-cur" data-key="bal-cur" placeholder="e.g. AED" value="${esc(b.currency)}" maxlength="6"></div>
          <button class="btn primary" data-act="bal-save">Update balance</button>
          ${b.amount != null ? '<button class="btn quiet" data-act="bal-cancel">Cancel</button>' : ''}
        </div>`
        : `<button class="btn" data-act="bal-edit">Update balance</button>`}
      ${(b.history || []).length > 1 ? `<div class="muted" style="font-size:14px">Previously ${b.history.slice(-4, -1).reverse().map((x) => `${money(x.amount, b.currency)} (${fmtDay(dateStr(new Date(x.at)))})`).map(esc).join(', ')}</div>` : ''}
    </div>
    <section class="section">
      <div class="section-head"><h2>Wishlist</h2>${wish.length ? `<span class="muted">${esc(money(wishTotal, b.currency))} in total</span>` : ''}</div>
      <div class="wish-form">
        <input class="input" id="wish-name" data-key="wish-name" placeholder="Item" aria-label="Item">
        <input class="input" id="wish-price" data-key="wish-price" type="number" step="0.01" placeholder="Price" aria-label="Price">
        <input class="input" id="wish-link" data-key="wish-link" placeholder="Link (optional)" aria-label="Link">
        <button class="btn" data-act="wish-add">${icon('plus')}Add</button>
      </div>
      ${wish.length ? `<ul class="rows">${wish.map((w) => `<li class="row">
          <div class="row-main" style="padding:4px 0"><span class="row-title">${w.link ? `<a href="${esc(safeUrl(w.link))}" target="_blank" rel="noopener" style="color:inherit">${esc(w.name)}</a>` : esc(w.name)}</span>
            <span class="row-meta">${w.price != null ? `<span class="wish-price">${esc(money(w.price, b.currency))}</span>` : ''}${w.price != null && b.amount != null ? (w.price <= b.amount ? '<span>Within your balance</span>' : `<span>${esc(money(w.price - b.amount, b.currency))} more than your balance</span>`) : ''}</span></div>
          <div class="row-actions" style="opacity:1"><button class="btn small" data-act="wish-bought" data-id="${w.id}">${icon('check')}Bought</button>
          <button class="icon-btn" data-act="wish-del" data-id="${w.id}" aria-label="Remove ${esc(w.name)}" title="Remove">${icon('trash-2')}</button></div></li>`).join('')}</ul>`
        : '<p class="muted">Add things you’d like to buy. They’re compared against your balance, nothing more.</p>'}
      ${bought.length ? `<p class="muted" style="margin-top:20px;font-size:15px">Bought: ${bought.map((w) => esc(w.name)).join(', ')}</p>` : ''}
    </section>
  </div>`;
}
function safeUrl(u) { try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : '#'; } catch (e) { return '#'; } }

function viewSkeleton() {
  return `<div class="page" aria-busy="true"><div class="skel" style="height:40px;width:55%;margin-bottom:16px"></div><div class="skel" style="height:18px;width:40%;margin-bottom:48px"></div>
    <p class="muted">Loading your desk from GitHub…</p>${'<div class="skel skel-line"></div>'.repeat(5)}</div>`;
}

/* ============================================================
   Render
   ============================================================ */
function preserveFocus(fn) {
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.key : null;
  let s = null, e = null;
  if (key) { try { s = a.selectionStart; e = a.selectionEnd; } catch (_) { /* not a text field */ } }
  const val = key && 'value' in a ? a.value : null;
  fn();
  if (key) {
    const n = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (n) {
      if (val != null && n.value !== val) n.value = val;
      n.focus({ preventScroll: true });
      if (s != null) { try { n.setSelectionRange(s, e); } catch (_) { /* ignore */ } }
    }
  }
}
function keepFieldValues(root, fn) {
  const vals = {};
  $$('[data-key]', root).forEach((n) => { if ('value' in n && n.type !== 'checkbox' && !n.dataset.noteEdit) vals[n.dataset.key] = n.value; });
  fn();
  for (const [k, v] of Object.entries(vals)) { const n = root.querySelector(`[data-key="${CSS.escape(k)}"]`); if (n && !n.value && v) n.value = v; }
}

function renderNav() {
  $('#nav').innerHTML = ROUTES.map(([id, label, ic]) => `<a href="#${id}" ${ui.view === id ? 'aria-current="page"' : ''} title="${label}">${icon(ic)}<span class="side-label">${label}</span></a>`).join('');
  $('#shell').classList.toggle('collapsed', !!ui.collapsed);
  const cb = $('#collapse');
  cb.innerHTML = icon(ui.collapsed ? 'panel-left-open' : 'panel-left-close');
  cb.setAttribute('aria-label', ui.collapsed ? 'Expand sidebar' : 'Collapse sidebar');
  cb.title = cb.getAttribute('aria-label');
}
function render() {
  renderNav();
  renderSync();
  const main = $('#view');
  const views = { home: viewHome, quests: viewQuests, projects: viewProjects, university: viewUniversity, notes: viewNotes, finance: viewFinance };
  preserveFocus(() => keepFieldValues(main, () => {
    main.innerHTML = Sync.firstLoad && isEmptyDb(db) ? viewSkeleton() : views[ui.view]();
  }));
  $$('[data-note-edit]', main).forEach(autosize);
  Drawer.refresh();
}

/* ============================================================
   Drawer (one at a time) and quick-capture popover
   ============================================================ */
const Drawer = {
  cfg: null, opener: null, stack: [],
  open(cfg) {
    if (this.cfg) this.stack.push({ cfg: this.cfg, opener: this.opener });
    this.cfg = cfg;
    this.opener = document.activeElement;
    const d = $('#drawer');
    d.classList.toggle('wide', !!cfg.wide);
    this.paint();
    $('#backdrop').classList.add('show');
    requestAnimationFrame(() => d.classList.add('show'));
    setTimeout(() => { const f = d.querySelector('[data-autofocus]') || d.querySelector('input, textarea, select, button'); f && f.focus({ preventScroll: true }); }, motionOK() ? 120 : 0);
  },
  paint() {
    const c = this.cfg, d = $('#drawer');
    const scroll = d.querySelector('.drawer-body')?.scrollTop || 0;
    d.innerHTML = `<div class="drawer-head"><h2 id="drawer-title">${esc(c.title())}</h2><button class="icon-btn" data-act="drawer-close" aria-label="Close" title="Close">${icon('x')}</button></div>
      <div class="drawer-body">${c.body()}</div>${c.foot ? `<div class="drawer-foot">${c.foot()}</div>` : ''}`;
    d.querySelector('.drawer-body').scrollTop = scroll;
    c.mount && c.mount(d);
  },
  refresh() { if (this.cfg && this.cfg.live && $('#drawer').classList.contains('show')) preserveFocus(() => this.paint()); },
  close() {
    if (!this.cfg) return;
    const closing = this.cfg;
    this.cfg = null;
    closing.onClose && closing.onClose();
    if (this.stack.length) {
      const prev = this.stack.pop();
      this.cfg = prev.cfg; this.opener = prev.opener;
      $('#drawer').classList.toggle('wide', !!this.cfg.wide);
      this.paint();
      return;
    }
    $('#drawer').classList.remove('show');
    if (!Pop.isOpen()) $('#backdrop').classList.remove('show');
    this.opener && this.opener.focus && document.contains(this.opener) && this.opener.focus({ preventScroll: true });
  },
  isOpen() { return !!this.cfg; },
};

const Pop = {
  opener: null,
  open(from) {
    this.opener = from || document.activeElement;
    const p = $('#pop');
    p.innerHTML = `<h2 style="margin-bottom:12px">Quick capture</h2>${captureHTML('pop')}`;
    const r = (from || $('#capture-open')).getBoundingClientRect();
    const w = Math.min(420, innerWidth - 24);
    const left = Math.min(Math.max(12, r.right + 12), innerWidth - w - 12);
    const top = Math.min(Math.max(12, r.top - 40), innerHeight - 330);
    Object.assign(p.style, { left: left + 'px', top: top + 'px', transformOrigin: `${r.left + r.width / 2 - left}px ${r.top + r.height / 2 - top}px` });
    $('#backdrop').classList.add('show');
    requestAnimationFrame(() => p.classList.add('show'));
    setTimeout(() => $('#pop-cap-text')?.focus(), motionOK() ? 60 : 0);
  },
  repaint() { const p = $('#pop'); preserveFocus(() => keepFieldValues(p, () => { p.innerHTML = `<h2 style="margin-bottom:12px">Quick capture</h2>${captureHTML('pop')}`; })); },
  close() {
    $('#pop').classList.remove('show');
    if (!Drawer.isOpen()) $('#backdrop').classList.remove('show');
    this.opener && document.contains(this.opener) && this.opener.focus({ preventScroll: true });
  },
  isOpen() { return $('#pop').classList.contains('show'); },
};

/* ============================================================
   Toasts: arrive along a slight curve from the control that
   triggered them (outer layer moves x, inner moves y, with
   different easing, so the path bends).
   ============================================================ */
function toast(text, { kind = 'ok', from = null, sub = '', action = null, duration = 5200 } = {}) {
  const wrap = $('#toasts');
  const x = document.createElement('div'); x.className = 'toast-x';
  const y = document.createElement('div'); y.className = 'toast-y';
  const t = document.createElement('div'); t.className = `toast ${kind}`;
  t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  t.innerHTML = `${icon(kind === 'error' ? 'circle-alert' : kind === 'info' ? 'bell' : 'check', 'icon t-icon')}<span class="t-text">${esc(text)}${sub ? `<span class="t-sub">${esc(sub)}</span>` : ''}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  y.appendChild(t); x.appendChild(y); wrap.appendChild(x);
  let gone = false;
  const dismiss = () => {
    if (gone) return; gone = true;
    if (motionOK()) {
      x.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(8px) scale(.98)' }], { duration: 180, easing: 'ease-in', fill: 'forwards' }).onfinish = () => x.remove();
    } else x.remove();
  };
  if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); dismiss(); });
  if (motionOK()) {
    const end = x.getBoundingClientRect();
    let dx = 0, dy = 24;
    const r = from && (from.getBoundingClientRect ? from.getBoundingClientRect() : from);
    if (r && r.width != null) { dx = (r.left + r.width / 2) - (end.left + end.width / 2); dy = (r.top + r.height / 2) - (end.top + end.height / 2); }
    x.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.7,.3,1)' });
    y.animate([{ transform: `translateY(${dy}px) scale(.6)`, opacity: 0 }, { opacity: 1, offset: .3 }, { transform: 'translateY(-3px) scale(1.01)', offset: .8 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.5,0,.3,1)' });
  }
  const timer = setTimeout(dismiss, duration);
  t.addEventListener('mouseenter', () => clearTimeout(timer));
  t.addEventListener('mouseleave', () => setTimeout(dismiss, 1800));
  return dismiss;
}

/* ============================================================
   Actions
   ============================================================ */
function go(view) { if (location.hash !== '#' + view) location.hash = view; else { ui.view = view; render(); } }

function burst(from, n = 12) {
  if (!motionOK() || !from) return;
  const r = from.getBoundingClientRect ? from.getBoundingClientRect() : from;
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'spark' + (i % 3 === 0 ? ' star' : '');
    s.style.left = x + 'px'; s.style.top = y + 'px';
    document.body.appendChild(s);
    const a = (Math.PI * 2 * i) / n + Math.random() * .5;
    const d = 22 + Math.random() * 26;
    s.animate([
      { transform: 'translate(0,0) scale(.4)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 6}px) scale(1) rotate(${i * 40}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(${Math.cos(a) * d * 1.2}px, ${Math.sin(a) * d * 1.2 + 10}px) scale(.2)`, opacity: 0 },
    ], { duration: 720 + Math.random() * 200, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => s.remove();
  }
}

async function completeQuest(id, btn) {
  const q = get('quests', id); if (!q) return;
  const rect = btn.getBoundingClientRect();
  if (motionOK()) {
    btn.classList.add('ticking');
    setTimeout(() => burst(btn), 200);
    await wait(440);
    const row = btn.closest('[data-row]');
    if (row) { row.style.height = row.offsetHeight + 'px'; void row.offsetHeight; row.classList.add('leaving'); await wait(260); }
  }
  const before = structuredClone(q);
  q.status = 'done'; q.doneAt = Date.now(); q.today = null;
  put('quests', q);
  const logId = log(`Completed ${q.title}${q.projectId && get('projects', q.projectId) ? ` (${projectName(q.projectId)})` : ''}`);
  let nextId = null;
  if (q.recur) {
    const base = q.deadline || todayStr();
    let nd = q.recur === 'daily' ? addDays(base, 1) : q.recur === 'weekly' ? addDays(base, 7) : addMonth(base);
    while (q.deadline && nd < todayStr()) nd = q.recur === 'daily' ? addDays(nd, 1) : q.recur === 'weekly' ? addDays(nd, 7) : addMonth(nd);
    const next = { ...structuredClone(before), id: uid(), status: 'active', createdAt: Date.now(), doneAt: null, today: null, keptDeadline: null, deadline: nd, steps: (before.steps || []).map((s) => ({ ...s, id: uid(), done: false })), remindAt: null };
    put('quests', next); nextId = next.id;
  }
  commit();
  let sub = '';
  const p = q.projectId && get('projects', q.projectId);
  if (p) { const pr = progress(p); sub = `${p.title} is now ${pr.pct}% done, ${pr.done} of ${pr.total}.`; }
  else if (nextId) sub = `The next one is due ${fmtDayInline(get('quests', nextId).deadline)}.`;
  else if (q.reward) sub = `Reward: ${q.reward}`;
  toast(`Completed ${q.title}`, {
    from: rect, sub,
    action: { label: 'Undo', fn: () => { put('quests', before); remove('activity', logId); if (nextId) remove('quests', nextId); commit(); } },
  });
  if (p && p.status !== 'completed') maybeOfferFinish(p);
}
function maybeOfferFinish(p) {
  const pr = progress(p);
  if (pr.total && pr.done === pr.total) {
    setTimeout(() => toast(`Everything in ${p.title} is done`, { kind: 'info', sub: 'Mark the project complete when you’re ready.', action: { label: 'Mark complete', fn: () => setProjectStatus(p.id, 'completed') }, duration: 9000 }), 500);
  }
}
function setProjectStatus(id, status) {
  const p = get('projects', id); if (!p || p.status === status) return;
  const prev = p.status;
  p.status = status;
  if (status === 'completed') p.completedAt = Date.now();
  put('projects', p);
  log(`${p.title || 'Project'} moved from ${PROJECT_STATUSES.find((s) => s[0] === prev)[1].toLowerCase()} to ${PROJECT_STATUSES.find((s) => s[0] === status)[1].toLowerCase()}`);
  commit();
  if (status === 'completed') showFinish(p);
  else toast(`${p.title} is now ${PROJECT_STATUSES.find((s) => s[0] === status)[1].toLowerCase()}`);
}
function sealSVG() {
  const pts = [];
  for (let i = 0; i < 36; i++) {
    const a = (Math.PI * 2 * i) / 36;
    const r = 66 + (i % 2 ? 3.5 : -1.5) + Math.sin(i * 1.7) * 2.5;
    pts.push(`${(75 + Math.cos(a) * r).toFixed(1)},${(75 + Math.sin(a) * r).toFixed(1)}`);
  }
  return `<svg class="seal" viewBox="0 0 150 150" aria-hidden="true">
    <circle class="glow" cx="75" cy="75" r="74"/>
    <polygon class="wax-body" points="${pts.join(' ')}" stroke="#5A1216" stroke-width="1" stroke-linejoin="round"/>
    <circle class="emboss-dark" cx="75.6" cy="75.6" r="49"/><circle class="emboss" cx="75" cy="75" r="49"/>
    <circle class="emboss" cx="75" cy="75" r="43" stroke-dasharray="2 4"/>
    <circle class="star" cx="75" cy="66" r="9"/><path class="star" d="M69 70 66.5 92h17L81 70Z"/>
    <path class="star" d="M75 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/><path class="star" d="M75 106l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/>
  </svg>`;
}
function showFinish(p) {
  const pr = progress(p);
  const qs = questsOf(p.id).filter((q) => q.status === 'done').length;
  const st = (p.stages || []).filter((s) => s.done).length;
  const ts = timeSpent(p);
  const el = document.createElement('div');
  el.className = 'finish'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'fin-title');
  el.innerHTML = `<div class="finish-card">
    <div class="seal-wrap">${sealSVG()}</div>
    <div class="fin-text">
      <h1 id="fin-title">${esc(p.title)} is complete</h1>${FLOURISH}
      ${p.goal ? `<p class="lede" style="margin:0 auto">${esc(p.goal)}</p>` : ''}
      <div class="fin-stats">
        <div><strong>${qs}</strong><span>${plural(qs, 'quest')} done</span></div>
        <div><strong>${st}</strong><span>${plural(st, 'stage')} done</span></div>
        ${ts ? `<div><strong>${esc(fmtMins(ts))}</strong><span>logged</span></div>` : ''}
        ${p.createdAt ? `<div><strong>${esc(parseDay(dateStr(new Date(p.createdAt))).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }))}</strong><span>started</span></div>` : ''}
      </div>
      <button class="btn primary" data-fin-close>Close</button>
    </div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { const sw = el.querySelector('.seal'); if (sw) burst(sw, 22); }, 560);
  const close = () => { el.classList.remove('show'); setTimeout(() => el.remove(), motionOK() ? 260 : 0); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  el.querySelector('[data-fin-close]').addEventListener('click', close);
  setTimeout(() => el.querySelector('[data-fin-close]').focus(), 50);
  void pr;
}

function doCapture(scope, btn) {
  const text = $(`#${scope}-cap-text`).value.trim();
  const err = $(`#${scope}-cap-err`);
  const type = ui.capType[scope];
  const fail = (m) => { err.textContent = m; err.hidden = false; };
  if (!text) return fail(type === 'note' ? 'Write something first.' : type === 'quest' ? 'Give the quest a name.' : 'Say what the reminder is for.');
  const rect = btn.getBoundingClientRect();
  if (type === 'note') {
    put('notes', { id: uid(), body: text, createdAt: Date.now() });
    log('Wrote a note');
    toast('Note saved', { from: rect });
  } else if (type === 'quest') {
    const deadline = $(`#${scope}-cap-date`)?.value || null;
    put('quests', { id: uid(), title: text, status: 'active', deadline, createdAt: Date.now(), steps: [] });
    toast('Quest added', { from: rect, sub: deadline ? `Due ${fmtDay(deadline)}` : '' });
  } else {
    const at = $(`#${scope}-cap-when`)?.value;
    if (!at) return fail('Choose when to be reminded.');
    put('reminders', { id: uid(), text, at, done: false, createdAt: Date.now() });
    toast('Reminder set', { from: rect, sub: fmtWhen(at) });
  }
  $$(`[data-capture="${scope}"] [data-key]`).forEach((n) => (n.value = ''));
  if (scope === 'pop') Pop.close();
  commit();
}

/* ---------- quest drawer ---------- */
function openQuest(id, preset = {}) {
  const existing = id ? get('quests', id) : null;
  const draft = existing ? structuredClone(existing) : { id: uid(), title: '', status: 'active', deadline: null, projectId: null, steps: [], createdAt: Date.now(), ...preset };
  let error = '';
  const projects = live('projects').filter((p) => p.status !== 'abandoned' || p.id === draft.projectId);
  const read = () => {
    const d = $('#drawer');
    draft.title = $('[data-key="q-title"]', d).value.trim();
    if (draft.title) error = '';
    draft.deadline = $('[data-key="q-deadline"]', d).value || null;
    draft.projectId = $('[data-key="q-project"]', d).value || null;
    const est = $('[data-key="q-estimate"]', d); if (est) draft.estimate = numOrNull(est.value);
    const rw = $('[data-key="q-reward"]', d); if (rw) draft.reward = rw.value.trim();
    const rc = $('[data-key="q-recur"]', d); if (rc) draft.recur = rc.value || null;
    const rm = $('[data-key="q-remind"]', d); if (rm) draft.remindAt = rm.value || null;
    const nt = $('[data-key="q-notes"]', d); if (nt) draft.notes = nt.value;
    $$('[data-step-text]', d).forEach((n) => { const s = draft.steps.find((x) => x.id === n.dataset.stepText); if (s) s.text = n.value; });
  };
  const hasMore = draft.estimate || draft.difficulty || draft.reward || (draft.steps || []).length || draft.recur || draft.remindAt || draft.notes;
  let moreOpen = !!hasMore;
  Drawer.open({
    title: () => (existing ? 'Edit quest' : 'New quest'),
    body: () => `
      <div class="field"><label for="q-title">Title</label><input class="input ${error ? 'invalid' : ''}" id="q-title" data-key="q-title" data-autofocus value="${esc(draft.title)}" placeholder="What needs doing?">${error ? `<span class="field-error">${esc(error)}</span>` : ''}</div>
      <div class="field-row">
        <div class="field"><label for="q-deadline">Deadline</label><input class="input" type="date" id="q-deadline" data-key="q-deadline" value="${draft.deadline || ''}"></div>
        <div class="field"><label for="q-project">Project</label><select class="select input" id="q-project" data-key="q-project"><option value="">None</option>${projects.map((p) => `<option value="${p.id}" ${p.id === draft.projectId ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}</select></div>
      </div>
      <details class="more" ${moreOpen ? 'open' : ''} data-more><summary>${icon('chevron-right')}More details</summary>
        <div class="field-row">
          <div class="field"><label for="q-estimate">Estimated time (minutes)</label><input class="input" type="number" min="0" step="5" id="q-estimate" data-key="q-estimate" value="${draft.estimate ?? ''}"></div>
          <div class="field"><span class="field-label">Difficulty</span>${seg('q-difficulty', DIFFICULTIES, draft.difficulty || '', 'aria-label="Difficulty"')}</div>
        </div>
        <div class="field"><label for="q-reward">Reward</label><input class="input" id="q-reward" data-key="q-reward" value="${esc(draft.reward || '')}" placeholder="Something to look forward to, if you like"></div>
        <div class="field"><span class="field-label">Steps</span>
          <ul class="stage-list">${(draft.steps || []).map((s) => `<li>${tick(s.done, 'q-step-toggle', s.id, `Step done: ${s.text}`, 'step-tick')}
            <input class="input" style="height:34px" data-step-text="${s.id}" data-key="step-${s.id}" value="${esc(s.text)}" aria-label="Step">
            <button class="icon-btn" data-act="q-step-del" data-id="${s.id}" aria-label="Remove step" title="Remove step">${icon('x')}</button></li>`).join('')}</ul>
          <div class="add-line"><input class="input" data-key="q-step-new" placeholder="Add a step" aria-label="New step"><button class="btn small" data-act="q-step-add">Add</button></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="q-recur">Repeats</label><select class="select input" id="q-recur" data-key="q-recur">${RECURS.map(([v, l]) => `<option value="${v}" ${v === (draft.recur || '') ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label for="q-remind">Reminder</label><input class="input" type="datetime-local" id="q-remind" data-key="q-remind" value="${draft.remindAt || ''}"></div>
        </div>
        <div class="field"><label for="q-notes">Notes</label><textarea class="textarea" id="q-notes" data-key="q-notes">${esc(draft.notes || '')}</textarea></div>
      </details>
      ${existing && existing.status !== 'active' ? `<p class="hint">This quest is ${existing.status === 'done' ? 'completed' : existing.status === 'held' ? 'on hold' : 'abandoned'}.</p>` : ''}`,
    foot: () => `${existing ? `<button class="btn danger" data-act="q-delete">${icon('trash-2')}Delete</button>` : ''}<span class="spacer"></span><button class="btn quiet" data-act="drawer-close">Cancel</button><button class="btn primary" data-act="q-save">${existing ? 'Save changes' : 'Create quest'}</button>`,
    mount: (d) => {
      const det = d.querySelector('[data-more]');
      det.addEventListener('toggle', () => { moreOpen = det.open; });
      d.querySelector('[data-key="q-step-new"]').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); d.querySelector('[data-act="q-step-add"]').click(); } });
      d.querySelector('[data-key="q-title"]').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); d.querySelector('[data-act="q-save"]').click(); } });
    },
    handlers: {
      'q-step-add': () => { read(); const n = $('[data-key="q-step-new"]', $('#drawer')); const v = n.value.trim(); if (!v) return; draft.steps.push({ id: uid(), text: v, done: false }); preserveFocus(() => Drawer.paint()); },
      'q-step-del': (el) => { read(); draft.steps = draft.steps.filter((s) => s.id !== el.dataset.id); Drawer.paint(); },
      'q-step-toggle': (el) => { read(); const s = draft.steps.find((x) => x.id === el.dataset.id); s.done = !s.done; Drawer.paint(); },
      'seg:q-difficulty': (v) => { read(); draft.difficulty = draft.difficulty === v ? null : v; Drawer.paint(); },
      'q-save': () => {
        read();
        if (!draft.title) { error = 'Give the quest a title.'; Drawer.paint(); return; }
        if (existing && existing.deadline !== draft.deadline) draft.keptDeadline = null;
        put('quests', draft);
        if (draft.status === 'abandoned' || draft.status === 'held') { /* status unchanged by editing */ }
        Drawer.close(); commit();
        toast(existing ? 'Quest saved' : 'Quest created');
      },
      'q-delete': () => { const copy = remove('quests', draft.id); Drawer.close(); commit(); toast('Quest deleted', { action: { label: 'Undo', fn: () => { restore('quests', copy); commit(); } } }); },
    },
  });
}

/* ---------- project drawer ---------- */
function openProject(id) {
  if (!id) {
    const p = put('projects', { id: uid(), title: '', goal: '', status: 'active', stages: [], timeLog: [], createdAt: Date.now(), fresh: true });
    persist();
    id = p.id;
  }
  const P = () => get('projects', id);
  Drawer.open({
    wide: true, live: true,
    title: () => (P() && P().fresh ? 'New project' : 'Project'),
    body: () => {
      const p = P(); if (!p) return '<p class="muted">This project was deleted.</p>';
      const qs = questsOf(p.id).sort((a, b) => (a.status === 'done') - (b.status === 'done') || questSort(a, b));
      const ts = timeSpent(p);
      return `
      <div class="field"><label for="p-title">Name</label><input class="input" id="p-title" data-key="p-title" data-autofocus data-pfield="title" value="${esc(p.title)}" placeholder="What is this project called?"></div>
      <div class="field"><label for="p-goal">Goal</label><textarea class="textarea" id="p-goal" data-key="p-goal" data-pfield="goal" placeholder="What does finished look like?" style="min-height:64px">${esc(p.goal || '')}</textarea></div>
      <div class="field"><span class="field-label">Status</span>${seg('p-status', PROJECT_STATUSES, p.status, 'aria-label="Project status"')}</div>
      ${meter(progress(p))}
      <h3 class="drawer-section">Stages</h3>
      <ul class="stage-list">${(p.stages || []).map((s) => `<li class="${s.done ? 'is-done' : ''}">${tick(s.done, 'p-stage-toggle', s.id, `Stage done: ${s.text}`, 'step-tick')}<span class="text">${esc(s.text)}</span>
        <button class="icon-btn" data-act="p-stage-del" data-id="${s.id}" aria-label="Remove stage" title="Remove stage">${icon('x')}</button></li>`).join('')}</ul>
      <div class="add-line"><input class="input" data-key="p-stage-new" placeholder="Add a stage or milestone" aria-label="New stage"><button class="btn small" data-act="p-stage-add">Add</button></div>
      <h3 class="drawer-section">Quests</h3>
      ${qs.length ? `<ul class="stage-list">${qs.map((q) => `<li class="${q.status === 'done' ? 'is-done' : ''}">${tick(q.status === 'done', 'p-quest-toggle', q.id, `${q.status === 'done' ? 'Mark not done' : 'Complete'}: ${q.title}`, 'step-tick')}
        <span class="text"><button class="link-btn" style="color:inherit;text-decoration:none;font-weight:400" data-act="open-quest" data-id="${q.id}">${esc(q.title)}</button>${q.status === 'held' ? ' <span class="faint">(on hold)</span>' : ''}${q.deadline && q.status === 'active' ? ` <span style="font-size:14px">${deadlineText(q.deadline)}</span>` : ''}</span></li>`).join('')}</ul>` : '<p class="muted" style="font-size:15px">No quests linked yet.</p>'}
      <div class="add-line"><input class="input" data-key="p-quest-new" placeholder="Add a quest to this project" aria-label="New quest"><button class="btn small" data-act="p-quest-add">Add</button></div>
      <h3 class="drawer-section">Time spent${ts ? `: ${esc(fmtMins(ts))}` : ''}</h3>
      <div class="add-line"><input class="input" type="number" min="1" step="5" data-key="p-time-min" placeholder="Minutes" aria-label="Minutes" style="max-width:120px"><input class="input" type="date" data-key="p-time-day" value="${todayStr()}" aria-label="Date" style="max-width:170px"><button class="btn small" data-act="p-time-add">Log time</button></div>
      ${(p.timeLog || []).length ? `<ul class="log" style="margin-top:8px">${[...p.timeLog].sort((a, b) => (a.day < b.day ? 1 : -1)).slice(0, 6).map((t) => `<li style="grid-template-columns:120px 1fr auto"><span class="faint">${esc(fmtDay(t.day))}</span><span>${esc(fmtMins(t.minutes))}</span><button class="icon-btn" data-act="p-time-del" data-id="${t.id}" aria-label="Remove entry" title="Remove entry">${icon('x')}</button></li>`).join('')}</ul>` : ''}`;
    },
    foot: () => `<button class="btn danger" data-act="p-delete">${icon('trash-2')}Delete project</button><span class="spacer"></span><button class="btn primary" data-act="drawer-close">Done</button>`,
    mount: (d) => {
      [['p-stage-new', 'p-stage-add'], ['p-quest-new', 'p-quest-add'], ['p-time-min', 'p-time-add']].forEach(([k, a]) => {
        d.querySelector(`[data-key="${k}"]`)?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); d.querySelector(`[data-act="${a}"]`).click(); } });
      });
      $$('[data-pfield]', d).forEach((n) => n.addEventListener('change', () => { const p = P(); if (!p) return; p[n.dataset.pfield] = n.value.trim(); put('projects', p); commit(); }));
    },
    onClose: () => {
      const p = P();
      if (!p) return;
      const t = $('[data-key="p-title"]')?.value.trim();
      if (t != null && t !== p.title) p.title = t;
      if (!p.title && !(p.stages || []).length && !questsOf(p.id).length) { remove('projects', p.id); commit(); return; }
      if (!p.title) p.title = 'Untitled project';
      if (p.fresh) { delete p.fresh; log(`Started project ${p.title}`); }
      put('projects', p); commit();
    },
    handlers: {
      'seg:p-status': (v) => setProjectStatus(id, v),
      'p-stage-add': () => { const n = $('[data-key="p-stage-new"]'); const v = n.value.trim(); if (!v) return; const p = P(); p.stages = [...(p.stages || []), { id: uid(), text: v, done: false }]; n.value = ''; put('projects', p); commit(); },
      'p-stage-del': (el) => { const p = P(); p.stages = p.stages.filter((s) => s.id !== el.dataset.id); put('projects', p); commit(); },
      'p-stage-toggle': (el) => {
        const p = P(); const s = p.stages.find((x) => x.id === el.dataset.id); s.done = !s.done; put('projects', p);
        if (s.done) burst(el, 8);
        if (s.done) log(`${p.title}: finished stage ${s.text}`);
        commit(); if (s.done) maybeOfferFinish(p);
      },
      'p-quest-add': () => { const n = $('[data-key="p-quest-new"]'); const v = n.value.trim(); if (!v) return; put('quests', { id: uid(), title: v, status: 'active', projectId: id, steps: [], createdAt: Date.now() }); n.value = ''; commit(); },
      'p-quest-toggle': (el) => {
        const q = get('quests', el.dataset.id); if (!q) return;
        if (q.status === 'done') { q.status = 'active'; q.doneAt = null; put('quests', q); commit(); return; }
        if (q.status !== 'active') { q.status = 'active'; put('quests', q); commit(); return; }
        burst(el, 8);
        q.status = 'done'; q.doneAt = Date.now(); q.today = null; put('quests', q); log(`Completed ${q.title} (${P().title || 'project'})`); commit(); maybeOfferFinish(P());
      },
      'p-time-add': () => {
        const m = numOrNull($('[data-key="p-time-min"]').value); const day = $('[data-key="p-time-day"]').value || todayStr();
        if (!m || m <= 0) return toast('Enter the minutes you spent.', { kind: 'error' });
        const p = P(); p.timeLog = [...(p.timeLog || []), { id: uid(), minutes: m, day }]; put('projects', p); log(`Logged ${fmtMins(m)} on ${p.title || 'a project'}`, day); commit();
      },
      'p-time-del': (el) => { const p = P(); p.timeLog = p.timeLog.filter((t) => t.id !== el.dataset.id); put('projects', p); commit(); },
      'p-delete': () => {
        const p = P(); const copy = remove('projects', id);
        const linked = live('quests').filter((q) => q.projectId === id);
        linked.forEach((q) => { q.projectId = null; put('quests', q); });
        Drawer.cfg.onClose = null; Drawer.close(); commit();
        toast(`Deleted ${p.title || 'project'}`, { sub: linked.length ? 'Its quests were kept.' : '', action: { label: 'Undo', fn: () => { restore('projects', copy); linked.forEach((q) => { const x = get('quests', q.id); if (x) { x.projectId = id; put('quests', x); } }); commit(); } } });
      },
    },
  });
}

/* ---------- settings ---------- */
function openSettings() {
  let connectError = '';
  Drawer.open({
    live: true,
    title: () => 'Settings',
    body: () => {
      const s = settings();
      const perm = 'Notification' in window ? Notification.permission : 'unsupported';

      return `
      <div class="set-group">

/* ============================================================
   Sync through the GitHub contents API
   ============================================================ */
function loadSyncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function saveSyncCfg() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(Sync.cfg)); } catch (e) { /* ignore */ } }
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) { const bin = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }

const Sync = {
  cfg: loadSyncCfg(), state: 'off', message: '', code: '', timer: null, busy: false, again: false, firstLoad: false,
  set(state, message = '', code = '') { this.state = state; this.message = message; this.code = code; renderSync(); },
  async api(method, path, body) {
    const r = await fetch('https://api.github.com' + path, {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + this.cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; try { e.body = await r.json(); } catch (_) { /* no body */ } throw e; }
    return r.status === 204 ? null : r.json();
  },
  contentsPath() { return `/repos/${this.cfg.repo}/contents/${DATA_PATH}`; },
  async getRemote() {
    try { const j = await this.api('GET', this.contentsPath()); return { sha: j.sha, data: normalise(JSON.parse(b64decode(j.content))) }; }
    catch (e) { if (e.status === 404) return { sha: null, data: null }; throw e; }
  },
  async putRemote(data, sha) {
    await this.api('PUT', this.contentsPath(), { message: 'Update desk data', content: b64encode(JSON.stringify(data)), ...(sha ? { sha } : {}) });
  },
  explain(e) {
    if (e.code === 'need-owner') return 'Enter the repository as username/atelier-desk-data.';
    if (e.code === 'public') return 'That repository is public. Make it private first (Settings → Danger Zone → Change visibility).';
    if (e.status === 401) return 'GitHub didn’t accept the token. It may have expired or been copied incompletely.';
    if (e.status === 403) return 'The token can’t write to that repository. Set Contents to “Read and write” on the token.';
    if (e.status === 404) return 'Couldn’t find that repository. Check the name, and that the token was given access to it.';
    return 'Couldn’t reach GitHub. Check your connection and try again.';
  },
  async connect(token, repo) {
    this.cfg = { token, repo };
    if (!repo.includes('/')) {
      try { const u = await this.api('GET', '/user'); this.cfg.repo = `${u.login}/${repo}`; }
      catch (e) { if (e.status === 401) throw e; const x = new Error('need-owner'); x.code = 'need-owner'; throw x; }
    }
    const info = await this.api('GET', `/repos/${this.cfg.repo}`);
    if (!info.private) { const x = new Error('public'); x.code = 'public'; throw x; }
    await this.run({ throwOnError: true });
    saveSyncCfg();
  },
  schedule(ms = 1200) {
    if (!this.cfg.token) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), ms);
    if (this.state !== 'error') this.set('pending');
  },
  async run({ throwOnError = false } = {}) {
    if (!this.cfg.token) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; clearTimeout(this.timer);
    this.set('saving');
    try {
      for (let attempt = 0; ; attempt++) {
        const remote = await this.getRemote();
        const merged = remote.data ? merge(remote.data, db) : db;
        if (canon(merged) !== canon(db)) { db = merged; persist(); this.firstLoad = false; render(); }
        if (!remote.data || canon(merged) !== canon(remote.data)) {
          try { await this.putRemote(merged, remote.sha); }
          catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) continue; throw e; }
        }
        break;
      }
      this.cfg.lastSync = Date.now(); saveSyncCfg();
      this.set('idle');
    } catch (e) {
      const offline = !e.status;
      this.set('error', offline ? 'Offline. Changes are saved on this device and will sync when you’re back.' : this.explain(e), e.status === 401 ? 'auth' : offline ? 'offline' : 'other');
      if (throwOnError) { this.busy = false; throw e; }
    } finally {
      this.busy = false;
      if (this.firstLoad) { this.firstLoad = false; render(); }
      if (this.again) { this.again = false; this.schedule(200); }
    }
  },
};
function renderSync() {
  const el = $('#sync-status'); if (!el) return;
  const s = Sync.cfg.token ? Sync.state : 'off';
  const map = {
    off: ['cloud-off', 'Saved on this device'],
    pending: ['cloud', 'Saving…'],
    saving: ['refresh-cw', 'Syncing…'],
    idle: ['cloud', Sync.cfg.lastSync ? `Synced ${fmtAgo(Sync.cfg.lastSync)}` : 'Synced'],
    error: ['circle-alert', Sync.code === 'offline' ? 'Offline, saved here' : 'Sync paused'],
  };
  const [ic, text] = map[s] || map.off;
  el.className = `sync-status ${s === 'error' ? 'error' : ''}`;
  el.title = s === 'error' ? Sync.message : text;
  el.innerHTML = `${icon(ic, `icon ${s === 'saving' ? 'spin' : ''}`)}<span class="sync-text">${esc(text)}</span>`;
}

/* ============================================================
   Notifications (only while the page is open)
   ============================================================ */
function seen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } }
function markSeen(k) { const s = seen(); s[k] = Date.now(); const cut = Date.now() - 60 * 864e5; for (const x in s) if (s[x] < cut) delete s[x]; try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  try { new Notification(title, { body, tag: title + body }); return true; } catch (e) { return false; }
}
function checkNotifications() {
  const s = settings(); const S = seen();
  const nowLocal = (() => { const d = new Date(); return `${dateStr(d)}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; })();
  const due = [
    ...live('reminders').filter((r) => !r.done && r.at && r.at <= nowLocal).map((r) => ({ key: 'r:' + r.id + r.at, text: r.text, kind: 'reminder', id: r.id })),
    ...live('quests').filter((q) => q.status === 'active' && q.remindAt && q.remindAt <= nowLocal).map((q) => ({ key: 'q:' + q.id + q.remindAt, text: q.title, kind: 'quest', id: q.id })),
  ].filter((x) => !S[x.key]);
  for (const x of due) {
    markSeen(x.key);
    if (s.notifyReminders) notify('Reminder', x.text);
    toast(x.text, { kind: 'info', sub: 'Reminder', duration: 12000, action: x.kind === 'reminder' ? { label: 'Done', fn: () => { const r = get('reminders', x.id); if (r) { r.done = true; put('reminders', r); commit(); } } } : { label: 'Open', fn: () => openQuest(x.id) } });
  }
  if (s.notifyDeadlines !== 'off') {
    const t = todayStr();
    const day = s.notifyDeadlines === 'day-before' ? addDays(t, 1) : t;
    const key = `d:${s.notifyDeadlines}:${t}`;
    if (!S[key]) {
      const list = deadlines(day, day).filter((d) => d.source !== 'reminder');
      markSeen(key);
      if (list.length) {
        const title = `${cap(numWord(list.length))} ${plural(list.length, 'deadline')} ${day === t ? 'today' : 'tomorrow'}`;
        const body = list.map((d) => d.title).join(', ');
        notify(title, body);
        toast(title, { kind: 'info', sub: body, duration: 10000 });
      }
    }
  }
}

/* ============================================================
   Atmosphere: drifting candle dust, the moon clock, optional art
   ============================================================ */
const Motes = {
  canvas: null, ctx: null, parts: [], sprite: null, raf: 0, w: 0, h: 0, dpr: 1,
  init() {
    this.canvas = $('#motes'); this.ctx = this.canvas.getContext('2d');
    addEventListener('resize', () => this.size());
    document.addEventListener('visibilitychange', () => this.toggle());
    this.size(); this.recolour();
    this.parts = Array.from({ length: 46 }, () => this.spawn(true));
    this.toggle();
  },
  size() {
    if (!this.canvas) return;
    this.dpr = Math.min(devicePixelRatio || 1, 2);
    this.w = innerWidth; this.h = innerHeight;
    this.canvas.width = this.w * this.dpr; this.canvas.height = this.h * this.dpr;
  },
  recolour() {
    if (!this.canvas) return;
    const rgb = getComputedStyle(document.documentElement).getPropertyValue('--mote').trim() || '212,175,100';
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.25, `rgba(${rgb},.7)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    this.sprite = c;
  },
  spawn(anywhere) {
    return { x: Math.random() * this.w, y: anywhere ? Math.random() * this.h : this.h + 10, r: 3 + Math.random() * 7, vy: .12 + Math.random() * .35, sway: Math.random() * Math.PI * 2, sw: .3 + Math.random() * .6, tw: Math.random() * Math.PI * 2, a: .25 + Math.random() * .55 };
  },
  toggle() {
    if (!this.canvas) return;
    const run = motionOK() && document.visibilityState === 'visible';
    cancelAnimationFrame(this.raf);
    if (run) { const step = () => { this.frame(); this.raf = requestAnimationFrame(step); }; this.raf = requestAnimationFrame(step); }
    else this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
  },
  frame() {
    const { ctx, dpr } = this;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      p.y -= p.vy; p.sway += .01; p.tw += .03;
      const x = p.x + Math.sin(p.sway) * 18 * p.sw;
      if (p.y < -20) { this.parts[i] = this.spawn(false); continue; }
      ctx.globalAlpha = p.a * (.55 + .45 * Math.sin(p.tw)) * Math.min(1, (this.h - p.y) / 120 + .2);
      ctx.drawImage(this.sprite, x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    }
    ctx.globalAlpha = 1;
  },
};
function updateClock() {
  const d = new Date();
  const m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
  const hh = $('.moon-clock .hand-h'), mm = $('.moon-clock .hand-m');
  if (hh) hh.style.transform = `rotate(${h * 30}deg)`;
  if (mm) mm.style.transform = `rotate(${m * 6}deg)`;
}
function loadArt() {
  const img = new Image();
  img.onload = () => { const a = $('.art'); a.style.setProperty('--art', `url("${img.src}")`); a.classList.add('loaded'); };
  img.src = 'backdrop.png';
}
function countUp(el, from, to, cur) {
  if (!el || !motionOK() || from == null || from === to) return;
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = money(Math.round((from + (to - from) * e) * 100) / 100, cur);
    if (k < 1) requestAnimationFrame(step); else el.textContent = money(to, cur);
  };
  requestAnimationFrame(step);
  burst(el, 14);
}

  },
  'wish-bought': (el) => { const w = get('wishlist', el.dataset.id); w.bought = true; put('wishlist', w); log(`Bought ${w.name}`); commit(); toast(`Marked ${w.name} as bought`, { from: el, action: { label: 'Undo', fn: () => { w.bought = false; put('wishlist', w); commit(); } } }); },
  'wish-del': (el) => { const copy = remove('wishlist', el.dataset.id); commit(); toast('Removed from wishlist', { from: el, action: { label: 'Undo', fn: () => { restore('wishlist', copy); commit(); } } }); },
};

document.addEventListener('click', (e) => {
  const segBtn = e.target.closest('[data-seg]');
  if (segBtn) {
    const name = segBtn.dataset.seg, v = segBtn.dataset.value;
    const h = Drawer.cfg && Drawer.cfg.handlers && Drawer.cfg.handlers['seg:' + name];
    if (h && segBtn.closest('#drawer')) return h(v);
    if (name === 'quest-tab') { ui.questTab = v; ui.rescheduling = null; render(); return; }
    if (name.startsWith('cap-')) {
      const scope = name.slice(4); ui.capType[scope] = v;
      if (scope === 'pop') Pop.repaint(); else render();
      $(`#${scope}-cap-text`)?.focus({ preventScroll: true });
      return;
    }
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  const dh = Drawer.cfg && Drawer.cfg.handlers && Drawer.cfg.handlers[a];
  if (dh && t.closest('#drawer')) return dh(t, e);
  const fn = ACT[a];
  if (fn) { if (t.tagName === 'A') e.preventDefault(); fn(t, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.setting) { const s = settings(); s[el.dataset.setting] = el.checked; put('singletons', s); commit(); }
});

let noteTimers = {};
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.noteEdit) {
    autosize(el);
    const id = el.dataset.noteEdit;
    clearTimeout(noteTimers[id]);
    noteTimers[id] = setTimeout(() => {
      const n = get('notes', id); if (!n || n.body === el.value) return;
      n.body = el.value; put('notes', n); persist(); Sync.schedule();
      const mark = el.closest('.note')?.querySelector('.saved-mark');
      if (mark) { mark.textContent = 'Saved'; mark.classList.add('show'); setTimeout(() => mark.classList.remove('show'), 1400); }
    }, 500);
  }
  if (el.id && el.id.endsWith('-cap-text')) { const err = $(`#${el.id.replace('-text', '-err')}`); if (err) err.hidden = true; }
});
document.addEventListener('focusout', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.noteEdit && el.isConnected && !el.value.trim()) {
    const id = el.dataset.noteEdit; clearTimeout(noteTimers[id]);
    const copy = remove('notes', id); commit(); toast('Empty note removed', { action: { label: 'Undo', fn: () => { restore('notes', copy); commit(); } } });
  }
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (Pop.isOpen()) { e.preventDefault(); Pop.close(); return; }
    if (Drawer.isOpen()) { e.preventDefault(); Drawer.close(); return; }
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    if (e.target.id === 'note-new') { e.preventDefault(); $('[data-act="note-add"]').click(); return; }
    const cap = e.target.closest && e.target.closest('[data-capture]');
    if (cap) { e.preventDefault(); cap.querySelector('[data-act="capture"]').click(); return; }
    if (Drawer.isOpen()) { const p = $('#drawer .drawer-foot .btn.primary'); if (p) { e.preventDefault(); p.click(); } }
  }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'n' || e.key === 'N') && !Drawer.isOpen() && !Pop.isOpen() && !document.querySelector('.finish')) {
    e.preventDefault(); Pop.open($('#capture-open'));
  }
});
$('#backdrop').addEventListener('click', () => { if (Pop.isOpen()) Pop.close(); else Drawer.close(); });
$('#capture-open').addEventListener('click', (e) => Pop.open(e.currentTarget));
$('#settings-open').addEventListener('click', () => openSettings());
$('#sync-status').addEventListener('click', () => { if (Sync.state === 'error') openSettings(); });
$('#collapse').addEventListener('click', () => { ui.collapsed = !ui.collapsed; saveUi(); renderNav(); });

function route() {
  const v = location.hash.slice(1);
  ui.view = ROUTES.some((r) => r[0] === v) ? v : 'home';
  Drawer.stack = []; if (Drawer.isOpen()) Drawer.close();
  render();
  const pg = $('#view .page');
  if (pg && motionOK()) { pg.classList.add('enter'); setTimeout(() => pg.classList.remove('enter'), 1500); }
  $('#main').focus({ preventScroll: true });
  scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Sync.run(); render(); } });
window.addEventListener('online', () => Sync.run());
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applyMotion);
window.addEventListener('storage', (e) => { if (e.key === KEY) { db = loadDb(); render(); } });

/* ---------- start ---------- */
$$('[data-icon]').forEach((n) => (n.innerHTML = ICONS[n.dataset.icon]));
Motes.init();
applyTheme();
applyMotion();
updateClock(); setInterval(updateClock, 20000);
loadArt();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
if (Sync.cfg.token) { Sync.firstLoad = isEmptyDb(db); Sync.state = 'idle'; }
route();
if (Sync.cfg.token) Sync.run();
checkNotifications();
setInterval(checkNotifications, 30000);
setInterval(() => { renderSync(); if (document.visibilityState === 'visible' && Sync.cfg.token && !Sync.busy) Sync.run(); }, 5 * 60000);
setInterval(renderSync, 60000);
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { if (ui.summaryDay === lastDay) ui.summaryDay = todayStr(); lastDay = todayStr(); render(); } }, 60000);

</script>
</body>
</html>
